<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Animated Logo</title>
    <style>
        :root {
            --primary-blue: hsl(215, 90%, 50%);
            --secondary-blue: hsl(205, 100%, 65%);
            --blue-glow: hsla(215, 90%, 50%, 0.4);
            --black: #0F172A;
            --white: #F8FAFC;
            --bg: #F8FAFC;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg);
            overflow: hidden;
        }
        .logo-container {
            width: 600px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .logo-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        /* --- LEFT: Network --- */
        .network-group {
            transform-origin: 150px 150px;
            animation: slowRotate 8s linear infinite;
        }
        @keyframes slowRotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        .con-line {
            fill: none;
            stroke-width: 0.8;
            stroke-linecap: round;
            opacity: 0.15;
        }
        .con-line.blue {
            stroke: var(--primary-blue);
        }
        .con-line.black {
            stroke: var(--black);
        }
        .data-trail {
            fill: none;
            stroke: var(--secondary-blue);
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-dasharray: 20, 100;
            stroke-dashoffset: 0;
            animation: flow 3s linear infinite;
            filter: drop-shadow(0 0 4px var(--secondary-blue));
        }
        @keyframes flow {
            from {
                stroke-dashoffset: 120;
            }
            to {
                stroke-dashoffset: 0;
            }
        }
        .node {
            transition: fill 0.5s ease;
        }
        .node.blue {
            fill: var(--primary-blue);
            animation: pulseBlue 2s ease-in-out infinite alternate;
        }
        @keyframes pulseBlue {
            0% {
                fill: var(--primary-blue);
                filter: drop-shadow(0 0 2px var(--blue-glow));
                transform: scale(0.95);
                opacity: 0.7;
            }
            100% {
                fill: var(--secondary-blue);
                filter: drop-shadow(0 0 12px var(--secondary-blue));
                transform: scale(1.05);
                opacity: 1;
            }
        }
        .node.black {
            fill: var(--black);
            opacity: 0.8;
        }
        /* --- RIGHT: Infinity Shape --- */
        .infinity-shape {
            opacity: 0;
            transform: scale(0.8) translateX(50px);
            animation: revealRight 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.1));
        }
        @keyframes revealRight {
            to {
                opacity: 1;
                transform: scale(1) translateX(0);
            }
        }
        .loop-path {
            fill: none;
            stroke: var(--black);
            stroke-width: 32;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <svg class="logo-svg" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
            <!-- Left Network -->
            <g class="network-group">
                <circle cx="150" cy="150" r="100" class="con-line" style="opacity: 0.05; stroke: var(--black);" />
                <path d="M 150 50 C 210 50, 250 110, 250 150" class="con-line blue" />
                <path d="M 150 50 C 90 50, 50 110, 50 150" class="con-line blue" />
                <path d="M 50 150 C 50 210, 90 250, 150 250" class="con-line black" />
                <path d="M 250 150 C 250 210, 210 250, 150 250" class="con-line black" />
                <!-- Flow -->
                <path d="M 150 50 C 210 50, 250 110, 250 150" class="data-trail" />
                <path d="M 50 150 C 50 210, 90 250, 150 250" class="data-trail"
                    style="animation-delay: -1.5s; stroke: var(--black); opacity: 0.4;" />
                <!-- Nodes -->
                <circle cx="150" cy="50" r="7" class="node blue" />
                <circle cx="100" cy="80" r="5" class="node blue" />
                <circle cx="200" cy="80" r="5" class="node blue" />
                <circle cx="50" cy="150" r="6" class="node blue" />
                <circle cx="250" cy="150" r="6" class="node blue" />
                <circle cx="150" cy="250" r="7" class="node black" />
                <circle cx="100" cy="220" r="5" class="node black" />
                <circle cx="200" cy="220" r="5" class="node black" />
            </g>
            <!-- Right Infinity/O -->
            <g class="infinity-shape" transform="translate(100, 0)">
                <path d="M 330 70 
                         C 400 70, 420 230, 330 230
                         C 260 230, 240 70, 330 70" class="loop-path" />
                <path d="M 330 70 
                         C 310 70, 280 100, 280 140" class="loop-path" style="stroke-width: 36;" />
                <circle cx="280" cy="140" r="6" fill="var(--black)" />
            </g>
        </svg>
    </div>
</body>
</html>
