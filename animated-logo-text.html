<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Team | Modern Animated Logo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0A58CA;
            --secondary-blue: #0084FF;
            --text-black: #0F172A;
            --bg-light: #F8FAFC;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-light);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 2.5rem;
            opacity: 1;
        }
        /* --- LEFT SIDE: Circular Network --- */
        .network-svg {
            width: 160px;
            height: 160px;
            overflow: visible;
        }
        .network-group {
            transform-origin: 50% 50%;
            animation: slowRotate 15s linear infinite;
        }
        @keyframes slowRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .node {
            transition: all 0.5s ease;
        }
        .node.blue {
            fill: var(--primary-blue);
            animation: pulseGlow 2.5s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% {
                fill: var(--primary-blue);
                filter: drop-shadow(0 0 2px rgba(10, 88, 202, 0.4));
                opacity: 0.8;
                transform: scale(0.95);
            }
            100% {
                fill: var(--secondary-blue);
                filter: drop-shadow(0 0 12px rgba(0, 132, 255, 0.7));
                opacity: 1;
                transform: scale(1.05);
            }
        }
        .node.black {
            fill: var(--text-black);
            opacity: 0.85;
        }
        .connector {
            fill: none;
            stroke-width: 0.8;
            stroke-linecap: round;
            opacity: 0.15;
        }
        .connector.blue {
            stroke: var(--primary-blue);
        }
        .connector.black {
            stroke: var(--text-black);
        }
        /* --- RIGHT SIDE: Typography --- */
        .text-group {
            display: flex;
            flex-direction: row;
            align-items: center;
            opacity: 0;
            transform: translateY(25px);
            animation: fadeInSlide 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
            position: relative;
        }
        @keyframes fadeInSlide {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .brand-text {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 0.9;
            margin: 0;
            white-space: nowrap;
            position: relative;
            display: flex;
        }
        /* Infinity Word - Blue to Black Blend */
        .infinity {
            background: linear-gradient(to right,
                    var(--primary-blue) 0%,
                    var(--primary-blue) 60%,
                    var(--text-black) 95%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-right: 0.15em;
            filter: drop-shadow(0 0 1px rgba(10, 88, 202, 0.3));
            animation: textGlow 3s ease-in-out infinite alternate;
        }
        @keyframes textGlow {
            0% {
                filter: drop-shadow(0 0 2px rgba(10, 88, 202, 0.2));
            }
            100% {
                filter: drop-shadow(0 0 10px rgba(0, 132, 255, 0.5));
            }
        }
        /* Team Word - Deep Black */
        .team {
            color: var(--text-black);
            margin-left: 0.1em;
        }
        /* Glossy Light Sweep Effect */
        .sweep-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            mix-blend-mode: screen;
        }
        .sweep-overlay::before {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0) 40%,
                    rgba(255, 255, 255, 0.5) 50%,
                    rgba(255, 255, 255, 0) 60%,
                    transparent 100%);
            transform: skewX(-25deg);
            animation: shineSweep 5s ease-in-out infinite;
        }
        @keyframes shineSweep {
            0% {
                left: -150%;
            }
            30%,
            100% {
                left: 150%;
            }
        }
        /* Visual Accents */
        .accent-dot {
            width: 8px;
            height: 8px;
            background: var(--primary-blue);
            border-radius: 50%;
            margin-left: 0.5rem;
            margin-top: 1rem;
            animation: pulseGlow 1.5s infinite alternate;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <!-- Icon: Network Structure -->
        <svg class="network-svg" viewBox="0 0 100 100">
            <g class="network-group">
                <!-- Background Glow -->
                <circle cx="50" cy="50" r="40" fill="rgba(10, 88, 202, 0.03)" />
                <!-- Connections -->
                <!-- Top (Blue) -->
                <path d="M 50 10 Q 75 10, 85 40" class="connector blue" />
                <path d="M 50 10 Q 25 10, 15 40" class="connector blue" />
                <path d="M 25 25 Q 50 40, 75 25" class="connector blue" />
                <!-- Bottom (Black) -->
                <path d="M 15 60 Q 25 90, 50 90" class="connector black" />
                <path d="M 85 60 Q 75 90, 50 90" class="connector black" />
                <path d="M 15 40 L 15 60" class="connector" style="stroke: #555;" />
                <path d="M 85 40 L 85 60" class="connector" style="stroke: #555;" />
                <!-- Centers -->
                <path d="M 50 10 L 50 90" class="connector" style="opacity: 0.05;" />
                <path d="M 15 50 L 85 50" class="connector" style="opacity: 0.05;" />
                <!-- Top Nodes (Blue) -->
                <circle cx="50" cy="10" r="5" class="node blue" />
                <circle cx="25" cy="25" r="4" class="node blue" />
                <circle cx="75" cy="25" r="4" class="node blue" />
                <circle cx="15" cy="40" r="3.5" class="node blue" />
                <circle cx="85" cy="40" r="3.5" class="node blue" />
                <!-- Bottom Nodes (Black) -->
                <circle cx="50" cy="90" r="5" class="node black" />
                <circle cx="20" cy="72" r="4" class="node black" />
                <circle cx="80" cy="72" r="4" class="node black" />
                <circle cx="15" cy="60" r="3.5" class="node black" />
                <circle cx="85" cy="60" r="3.5" class="node black" />
            </g>
        </svg>
        <!-- Branding: Typography -->
        <div class="text-group">
            <h1 class="brand-text">
                <span class="infinity">INFINITY</span>
                <span class="team">TEAM</span>
                <div class="sweep-overlay"></div>
            </h1>
            <div class="accent-dot"></div>
        </div>
    </div>
</body>
</html>
